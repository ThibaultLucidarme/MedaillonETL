
x-spark-image: &spark-image
  image: apache/spark-py:latest
x-spark-worker: &spark-worker
  <<: *spark-image
  command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
  depends_on:
    - spark-master
  environment:
    - SPARK_MODE=worker
    - SPARK_WORKER_CORES=2
    - SPARK_WORKER_MEMORY=1g
    - SPARK_MASTER_URL=spark://spark-master:7077
    - SPARK_WORKER_DIR=/tmp/spark-work"

services:
  spark-master:
    <<: *spark-image
    environment:
      - SPARK_MODE=master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080" # Spark Master web UI
      - "7077:7077" # Spark Master port
      - "4040:4040" # Spark application UI
    volumes:
      - ./logs/spark/master:/opt/spark/logs

  # docker-compose up -d --scale spark-worker=5
  spark-worker:
    <<: *spark-worker
    deploy:
      mode: replicated
      replicas: 2

  postgres:
    image: postgres:14.0
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-standalone:
    # image: apache/airflow:latest-python3.11
    build: ./docker/airflow
    env_file:
      - airflow.env
    volumes:
      - ./src/jobs:/opt/airflow/jobs
      - ./src/dags:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: standalone
    ports:
      - "8080:8080"

